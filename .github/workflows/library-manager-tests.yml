name: Library Manager Tests
on:
  push:
    paths:
      - "LibraryManager/**"
      - ".github/workflows/library-manager-tests.yml"
  pull_request:
    paths:
      - "LibraryManager/**"
      - ".github/workflows/library-manager-tests.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python modules
        run: python -m compileall -q LibraryManager
      - name: Run SFZ parser regression tests
        working-directory: LibraryManager
        run: python -m unittest -v test_sfz_parser.py
